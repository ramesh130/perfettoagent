name: CI

# Automatic runs are disabled: the account's GitHub Actions budget is $0.
# To re-enable, restore these triggers:
#   pull_request:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The large trace fixtures are in Git LFS (ADR-0004). Without this, their
          # tests would find pointer files, which the flag on the test step fails.
          lfs: true
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      # The one networked step: download and verify the pinned trace processor, so the
      # tests that query the fixture trace run instead of skipping.
      - name: Fetch pinned trace processor
        run: uv run perfettoagent tp --trace tests/fixtures/tiny.perfetto-trace --sql "select 1"
      - name: Test (network disabled via pytest-socket)
        run: uv run pytest -q
        env:
          PERFETTOAGENT_REQUIRE_TRACE_PROCESSOR: "1"
