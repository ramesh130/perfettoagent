[project]
name = "perfettoagent"
version = "0.1.0"
description = "Agentic Android performance triage: Perfetto trace + git range in, cited diagnosis out."
authors = [
    { name = "Ramesh Prasad", email = "ramesh130@gmail.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
perfettoagent = "perfettoagent.cli:main"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-socket>=0.7",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# PRD §11: the suite must pass with no network. pytest-socket fails any test that opens one.
addopts = "--disable-socket"
